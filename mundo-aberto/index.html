<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Poeira Maldita: Mundo Aberto</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #1e120c; }
  body { font-family: Rockwell, "Roboto Slab", Georgia, serif; color: #f1d9a8; user-select: none; }
  canvas { display: block; }
  .hud { position: fixed; font-size: 18px; text-shadow: 2px 2px 0 #1e120c; pointer-events: none; }
  #vida { top: 14px; left: 14px; }
  #barra { width: 200px; height: 14px; background: #3a2416; border: 2px solid #1e120c; }
  #barra i { display: block; height: 100%; width: 100%; background: #b3321f; }
  #hora { top: 14px; right: 14px; }
  #bala { bottom: 14px; left: 14px; }
  #caca { bottom: 14px; right: 14px; text-align: right; line-height: 1.5; }
  #mira { top: 50%; left: 50%; width: 8px; height: 8px; margin: -4px 0 0 -4px; border: 2px solid #f1d9a8; border-radius: 50%; }
  #aviso { top: 18%; left: 0; right: 0; text-align: center; font-size: 22px; opacity: 0; transition: opacity .3s; }
  #dano { inset: 0; background: #b3321f; opacity: 0; }
  #tela { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
          background: rgba(30, 18, 12, .86); text-align: center; cursor: pointer; padding: 20px; }
  #tela h1 { margin: 0 0 12px; font-size: clamp(1.8rem, 6vw, 3rem); color: #d98a3d; text-shadow: 3px 3px 0 #b3321f; }
  #tela p { margin: 4px 0; max-width: 46ch; line-height: 1.5; }
</style>
</head>
<body>
<div id="vida" class="hud">Vida<div id="barra"><i></i></div></div>
<div id="hora" class="hud"></div>
<div id="bala" class="hud"></div>
<div id="caca" class="hud"></div>
<div id="mira" class="hud"></div>
<div id="aviso" class="hud"></div>
<div id="dano" class="hud"></div>
<div id="tela">
  <h1 id="titulo">Poeira Maldita: Mundo Aberto</h1>
  <p id="sub">Clique para jogar</p>
  <p>W A S D andar, Shift correr, mouse olhar, clique atirar</p>
  <p>R recarregar, E montar ou descer do cavalo</p>
  <p>Cuidado com os jacarés nos lagos e com os coiotes à noite. Joga no computador, com teclado e mouse.</p>
</div>

</html>
